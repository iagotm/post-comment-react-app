name: CI
on: [push]
jobs:
  build-test:
    runs-on: Ubuntu-24.04.2.x64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Cypress Tests
        uses: cypress-io/github-action@v5
        with:
          start: 'npm run dev'
          build: npm run build
          
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cypress Results
          path: |
              cypress/screenshots
              cypress/videos
              cypress/Results
          if-no-files-found: ignore